<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAW</title>

    <style>
        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            font-family: "Segoe UI", sans-serif;
            overflow: hidden;

            transition: background 0.25s ease, color 0.25s ease;
        }

        body.dark {
            background: #0d0c10;
            color: #ffffff;
        }

        body.dark p {
            color: #9ca3af;
        }

        body.dark .spinner {
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: #f1658a;
        }

        body:not(.dark) {
            background: #faf7f9;
            color: #2e2535;
        }

        body:not(.dark) p {
            color: #7a6e78;
        }

        body:not(.dark) .spinner {
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top-color: #d93c6e;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<h1>PAW</h1>
<p>Loading...</p>

<div class="spinner"></div>
</body>
<script>
    function applyTheme(isDark) {
        document.body.classList.toggle('dark', isDark);
    }

    window.electron.isDark().then(applyTheme);
    window.electron.onChange(applyTheme);
</script>
</html>
